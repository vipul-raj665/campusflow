services:
  # Backend REST API + Socket.IO Server
  - type: web
    name: campusflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: '*'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

  # Frontend React 18 + Vite SPA (Static site - globally served on CDN, no region)
  - type: web
    name: campusflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://campusflow-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://campusflow-backend.onrender.com
